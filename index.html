<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SparkleDex</title>

<!-- Fonts & Barcode Scanner Library -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-main: #FAF7F5;
    --card-bg: #FFFFFF;
    --primary-lilac: #D8B4E2;
    --primary-rose: #F4ACB7;
    --text-main: #4A4453;
    --text-sub: #8C8294;
    --border-color: #F0EAF2;
    
    --tag-manga-bg: #E3F6EF;
    --tag-manga-txt: #2E7D63;
    --tag-novel-bg: #FFE5EC;
    --tag-novel-txt: #D85A75;
  }

  body {
    background-color: #E6E1DA;
    font-family: 'Mitr', 'Plus Jakarta Sans', sans-serif;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .mobile-container {
    width: 100%;
    max-width: 412px;
    background-color: var(--bg-main);
    min-height: 100vh;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .screen { display: none; flex-direction: column; padding-bottom: 90px; }
  .screen.active { display: flex; }

  /* Header */
  .header { padding: 22px 20px 14px 20px; display: flex; justify-content: space-between; align-items: center; }
  .logo-title {
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #B583C7, #E58C99); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .btn-header-action {
    width: 38px; height: 38px; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center;
    color: #FFF; cursor: pointer; background: linear-gradient(135deg, var(--primary-lilac), var(--primary-rose));
    box-shadow: 0 4px 14px rgba(216, 180, 226, 0.45); transition: transform 0.15s;
  }
  .btn-header-action:active { transform: scale(0.95); }

  /* Mode Switcher */
  .mode-switch-wrap { padding: 0 20px 12px 20px; }
  .mode-switch { display: flex; background: #EFE7F2; border-radius: 14px; padding: 4px; gap: 4px; }
  .mode-btn {
    flex: 1; padding: 8px 0; border: none; border-radius: 10px; background: transparent;
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-sub); cursor: pointer; transition: all 0.2s;
  }
  .mode-btn.active { background: #FFF; color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  /* Search & Filters */
  .filter-section { padding: 0 20px 14px 20px; display: flex; flex-direction: column; gap: 10px; }
  .search-input-wrap { position: relative; display: flex; align-items: center; }
  .search-input-wrap .search-icon { position: absolute; left: 14px; width: 18px; height: 18px; stroke: var(--text-sub); fill: none; stroke-width: 2; }
  .search-bar {
    width: 100%; height: 44px; border-radius: 14px; border: 1.5px solid var(--border-color); background: var(--card-bg);
    padding: 0 44px 0 40px; font-size: 13.5px; font-family: inherit; color: var(--text-main); outline: none; transition: border-color 0.2s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  }
  .search-bar:focus { border-color: var(--primary-lilac); }
  .btn-scan-barcode {
    position: absolute; right: 8px; width: 30px; height: 30px; border-radius: 8px; border: none;
    background: #F4EBF7; color: #9A5BAE; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  .filter-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; -ms-overflow-style: none; scrollbar-width: none; }
  .filter-pills::-webkit-scrollbar { display: none; }
  .pill-select {
    height: 32px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--card-bg); padding: 0 10px;
    font-size: 12px; font-family: inherit; color: var(--text-main); outline: none; font-weight: 500; cursor: pointer;
  }

  /* Book Cards */
  .book-list { padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }
  .book-card-item {
    background: var(--card-bg); border-radius: 16px; padding: 12px 14px; border: 1px solid var(--border-color);
    box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    transition: transform 0.15s ease;
  }
  .book-card-item:active { transform: scale(0.985); }
  .card-top-row { display: flex; justify-content: space-between; align-items: center; }
  .card-title-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; margin-right: 8px; }
  .tag-badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; }
  .tag-manga { background: var(--tag-manga-bg); color: var(--tag-manga-txt); }
  .tag-novel { background: var(--tag-novel-bg); color: var(--tag-novel-txt); }
  .book-name-text { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .card-action-group { display: flex; align-items: center; gap: 6px; }
  .vol-chip { background: #F4EBF7; padding: 3px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #9A5BAE; font-family: 'Plus Jakarta Sans', sans-serif; }
  .btn-quick-plus {
    height: 26px; min-width: 26px; border-radius: 8px; border: none; background: linear-gradient(135deg, #D8B4E2, #F4ACB7);
    color: #FFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 2px 6px rgba(216, 180, 226, 0.5); padding: 0 6px;
  }

  .card-progress-row { display: flex; align-items: center; gap: 8px; }
  .progress-track { flex: 1; height: 5px; background: #F0EAF2; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #D8B4E2, #C5E1A5); }
  .progress-text { font-size: 10.5px; color: var(--text-sub); font-family: 'Plus Jakarta Sans', sans-serif; white-space: nowrap; }

  /* Pagination */
  .pagination-container { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
  .btn-page {
    height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--card-bg);
    font-size: 12px; font-weight: 600; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 4px;
  }
  .btn-page:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-info { font-size: 12px; font-weight: 600; color: var(--text-sub); font-family: 'Plus Jakarta Sans', sans-serif; }

  /* Dashboard Styles */
  .dash-container { padding: 0 20px; display: flex; flex-direction: column; gap: 14px; }
  .dash-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-hero-card { border-radius: 20px; padding: 18px 16px; color: #FFF; display: flex; flex-direction: column; justify-content: space-between; min-height: 104px; box-shadow: 0 8px 20px rgba(216, 180, 226, 0.25); }
  .hero-spend { background: linear-gradient(135deg, #B583C7, #D898A4); }
  .hero-count { background: linear-gradient(135deg, #A46FB7, #C6808E); }
  .hero-top-row { display: flex; justify-content: space-between; align-items: center; }
  .hero-label { font-size: 11px; font-weight: 500; color: rgba(255, 255, 255, 0.9); }
  .hero-val { font-size: 22px; font-weight: 700; color: #FFF; font-family: 'Plus Jakarta Sans', sans-serif; margin-top: 4px; }
  .stat-card { background: var(--card-bg); border-radius: 18px; padding: 14px 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 2px; }
  .stat-val { font-size: 20px; font-weight: 700; color: #9A5BAE; font-family: 'Plus Jakarta Sans', sans-serif; }
  .stat-label { font-size: 11px; color: var(--text-sub); font-weight: 500; }
  .stat-sub { font-size: 10px; color: #A89FAE; margin-top: 2px; }
  .breakdown-card { background: var(--card-bg); border-radius: 18px; padding: 18px 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
  .breakdown-title { font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
  .breakdown-item { margin-bottom: 12px; }
  .breakdown-item:last-child { margin-bottom: 0; }
  .breakdown-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; color: var(--text-main); }
  .breakdown-bar-bg { height: 7px; background: #F4EBF7; border-radius: 4px; overflow: hidden; }
  .breakdown-bar-fill { height: 100%; border-radius: 4px; }

  /* Modals */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(74, 68, 83, 0.5); backdrop-filter: blur(4px);
    display: none; z-index: 999; opacity: 0; transition: opacity 0.3s ease; padding: 20px;
  }
  .modal-overlay.show { display: flex; justify-content: center; align-items: center; opacity: 1; }
  .modal-content {
    background: #FFFFFF; width: 100%; max-width: 412px; border-radius: 24px;
    padding: 24px 22px; transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    max-height: 85vh; overflow-y: auto; margin: auto; box-shadow: 0 16px 40px rgba(0,0,0,0.1);
  }
  .modal-overlay.show .modal-content { transform: scale(1); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 18px; font-weight: 600; color: var(--text-main); }
  .btn-close { background: none; border: none; cursor: pointer; color: var(--text-sub); display: flex; align-items: center; }

  .form-group { margin-bottom: 16px; position: relative; }
  .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
  .form-input {
    width: 100%; height: 44px; border-radius: 12px; border: 1.5px solid var(--border-color); padding: 0 14px;
    font-size: 14px; font-family: inherit; color: var(--text-main); outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--primary-lilac); }
  .suggestions-box {
    position: absolute; top: 70px; left: 0; right: 0; background: #FFF; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); border: 1px solid var(--border-color); max-height: 180px; overflow-y: auto; z-index: 10; display: none;
  }
  .suggestion-item { padding: 12px 14px; font-size: 13.5px; border-bottom: 1px solid #FAF7FA; cursor: pointer; }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: #FAF5FC; color: #9A5BAE; font-weight: 500; }
  .chips-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { padding: 6px 12px; border-radius: 16px; background: #FAF7FA; border: 1px solid var(--border-color); font-size: 12px; color: var(--text-sub); cursor: pointer; transition: all 0.2s; }
  .chip.active { background: #F4EBF7; border-color: var(--primary-lilac); color: #9A5BAE; font-weight: 600; }
  .segment-control { display: flex; background: #FAF7FA; border-radius: 12px; padding: 4px; gap: 4px; }
  .segment-btn { flex: 1; text-align: center; padding: 8px; border-radius: 8px; border: none; background: transparent; font-size: 13px; font-weight: 500; color: var(--text-sub); cursor: pointer; }
  .segment-btn.active { background: #FFF; color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .btn-step { width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid var(--border-color); background: #FFF; font-size: 18px; color: #9A5BAE; display: flex; justify-content: center; align-items: center; cursor: pointer; }
  .stepper input { width: 60px; text-align: center; height: 36px; border-radius: 10px; border: 1.5px solid var(--border-color); font-size: 16px; font-weight: 600; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-save {
    width: 100%; height: 50px; border-radius: 16px; border: none; margin-top: 10px;
    background: linear-gradient(135deg, var(--primary-lilac), var(--primary-rose)); color: #FFF; font-size: 16px; font-weight: 600; font-family: inherit;
    box-shadow: 0 4px 16px rgba(216, 180, 226, 0.5); cursor: pointer;
  }
  .btn-save:disabled { opacity: 0.7; cursor: not-allowed; }

  /* Scanner */
  #scanner-view { width: 100%; border-radius: 16px; overflow: hidden; margin-bottom: 14px; }

  /* Bottom Dock */
  .bottom-dock {
    position: absolute; bottom: 0; left: 0; right: 0; height: 72px; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 90;
  }
  .nav-tab {
    display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
    padding: 6px 24px; border-radius: 14px; border: none; background: transparent; color: #B0A8B8;
  }
  .nav-tab svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }
  .nav-tab span { font-size: 11px; font-weight: 500; font-family: inherit; }
  .nav-tab.active-tab { color: #9A5BAE; font-weight: 600; }

  /* Login Overlay */
  .login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-main); z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .login-box { width: 100%; max-width: 340px; background: #FFF; border-radius: 28px; padding: 32px 24px; box-shadow: 0 12px 36px rgba(216, 180, 226, 0.25); border: 1px solid var(--border-color); text-align: center; }
  .login-icon { width: 54px; height: 54px; border-radius: 16px; background: #F4EBF7; color: #9A5BAE; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; }
  .login-title { font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
  .login-sub { font-size: 12px; color: var(--text-sub); margin-bottom: 24px; }
  .login-input { width: 100%; height: 46px; border-radius: 14px; border: 1.5px solid var(--border-color); padding: 0 14px; font-size: 14px; font-family: inherit; color: var(--text-main); outline: none; margin-bottom: 12px; text-align: center; }
  .btn-login { width: 100%; height: 48px; border-radius: 14px; border: none; background: linear-gradient(135deg, var(--primary-lilac), var(--primary-rose)); color: #FFF; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px rgba(216, 180, 226, 0.4); }
</style>
</head>
<body>

<div class="login-overlay" id="loginScreen">
  <div class="login-box">
    <div class="login-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <div class="login-title">SparkleDex</div>
    <div class="login-sub">กรุณายืนยันตัวตนเพื่อเข้าใช้งาน</div>
    <form onsubmit="handleLogin(event)">
      <input type="text" id="loginUser" class="login-input" placeholder="ชื่อผู้ใช้" required>
      <input type="password" id="loginPass" class="login-input" placeholder="รหัสผ่าน" required>
      <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>

<div class="mobile-container" id="appContainer">

  <div class="screen active" id="libScreen">
    <header class="header">
      <div class="logo-group"><h1 class="logo-title">SparkleDex</h1></div>
      <div class="header-actions">
        <button class="btn-header-action" onclick="openAddModal()" title="เพิ่มเล่มใหม่">
          <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </header>

    <div class="mode-switch-wrap">
      <div class="mode-switch">
        <button class="mode-btn active" id="btnModeLib" onclick="switchLibMode('library')">คลังหนังสือของฉัน</button>
        <button class="mode-btn" id="btnModeWish" onclick="switchLibMode('wishlist')">✨ Wishlist ตามเก็บ</button>
      </div>
    </div>

    <div class="filter-section">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="libSearchInput" class="search-bar" placeholder="ค้นหาชื่อเรื่อง, สำนักพิมพ์..." oninput="onFilterChange()">
        <button class="btn-scan-barcode" onclick="openBarcodeScanner()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14M21 5v14"/></svg>
        </button>
      </div>
      <div class="filter-pills">
        <select id="filterType" class="pill-select" onchange="onFilterChange()"><option value="all">ทุกประเภท</option><option value="มังงะ">มังงะ</option><option value="นิยาย">นิยาย</option></select>
        <select id="filterBacklog" class="pill-select" onchange="onFilterChange()"><option value="all">สถานะการอ่านทั้งหมด</option><option value="unread_only">🔥 ดองไว้ (ยังอ่านไม่ครบ)</option><option value="read_all">✨ อ่านครบแล้ว</option></select>
        <select id="filterPublisher" class="pill-select" onchange="onFilterChange()"><option value="all">ทุกสำนักพิมพ์</option></select>
      </div>
    </div>

    <div class="book-list" id="libraryCardsContainer">
      <div class="empty-state">กำลังโหลดข้อมูล...</div>
    </div>

    <!-- เปลี่ยนเหลือ 5 รายการ/หน้า -->
    <div class="pagination-container" id="paginationBar">
      <button class="btn-page" id="btnPrevPage" onclick="changePage(-1)">
        <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg> ก่อนหน้า
      </button>
      <span class="page-info" id="pageIndicator">หน้า 1 / 1</span>
      <button class="btn-page" id="btnNextPage" onclick="changePage(1)">ถัดไป 
        <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </div>

  <div class="screen" id="dashScreen">
    <header class="header"><div class="logo-group"><h1 class="logo-title">Analytics</h1></div></header>
    <div class="dash-container">
      <div class="dash-grid-2">
        <div class="stat-hero-card hero-spend">
          <div class="hero-top-row"><span class="hero-label">ยอดสะสมค่าหนังสือ</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
          <div class="hero-val" id="dashTotalPrice">฿0</div>
        </div>
        <div class="stat-hero-card hero-count">
          <div class="hero-top-row"><span class="hero-label">จำนวนหนังสือทั้งหมด</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
          <div class="hero-val" id="dashTotalVols">0 <span style="font-size: 14px; font-weight: normal;">เล่ม</span></div>
        </div>
      </div>
      <div class="breakdown-card">
        <div class="breakdown-title"><span>จำนวนหนังสือแยกตามสำนักพิมพ์</span></div>
        <div id="pubVolumeList"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-dock">
    <button class="nav-tab active-tab" id="tabLib" onclick="switchTab('lib')">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg> <span>คลังหนังสือ</span>
    </button>
    <button class="nav-tab" id="tabDash" onclick="switchTab('dash')">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> <span>แดชบอร์ด</span>
    </button>
  </nav>

  <!-- ================= MODAL: ADD NEW VOLUME ================= -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">บันทึกเล่มใหม่</h2>
        <button class="btn-close" onclick="closeAddModal()"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>

      <form id="addForm" onsubmit="handleSave(event)">
        <input type="hidden" id="titleId" name="titleId">
        <input type="hidden" id="wishlistRemoveId"> <!-- สำหรับเช็คตอนย้ายจาก Wishlist -->

        <!-- ตัวเลือกว่าจะบันทึกลงที่ไหน -->
        <div class="form-group">
          <label class="form-label">ปลายทางจัดเก็บ</label>
          <div class="segment-control">
            <button type="button" class="segment-btn active" id="btnDestLib" onclick="setDestination('library')">เข้าคลังหนังสือ</button>
            <button type="button" class="segment-btn" id="btnDestWish" onclick="setDestination('wishlist')">ลง Wishlist</button>
          </div>
          <input type="hidden" id="saveDestination" value="library">
        </div>

        <div class="form-group">
          <label class="form-label">ชื่อเรื่อง</label>
          <input type="text" id="titleName" class="form-input" required oninput="filterSuggestions()">
          <div class="suggestions-box" id="suggestionsBox"></div>
        </div>

        <div class="form-group">
          <label class="form-label">ประเภท</label>
          <div class="segment-control">
            <button type="button" class="segment-btn active" id="btnTypeManga" onclick="setType('มังงะ')">มังงะ</button>
            <button type="button" class="segment-btn" id="btnTypeNovel" onclick="setType('นิยาย')">นิยาย</button>
          </div>
          <input type="hidden" id="typeVal" value="มังงะ">
        </div>

        <div class="form-group">
          <label class="form-label">สำนักพิมพ์</label>
          <div class="chips-container">
            <div class="chip" onclick="setPublisher('Siam Inter Comics', this)">Siam Inter</div>
            <div class="chip" onclick="setPublisher('Phoenix Next', this)">Phoenix</div>
            <div class="chip" onclick="setPublisher('Luckpim', this)">Luckpim</div>
            <div class="chip" onclick="setPublisher('Bongkoch', this)">Bongkoch</div>
          </div>
          <input type="text" id="publisher" class="form-input" required>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">เล่มที่</label>
            <div class="stepper">
              <div class="btn-step" onclick="stepVol(-1)">-</div>
              <input type="number" id="volNo" value="1" min="1" required>
              <div class="btn-step" onclick="stepVol(1)">+</div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">ราคา (บาท)</label>
            <input type="number" id="price" class="form-input" value="0" min="0">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">วันที่ซื้อ</label>
            <input type="date" id="purchaseDate" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">สถานะ</label>
            <div class="segment-control">
              <button type="button" class="segment-btn active" id="btnStatusUnread" onclick="setStatus('ยังไม่อ่าน')">ยังไม่อ่าน</button>
              <button type="button" class="segment-btn" id="btnStatusRead" onclick="setStatus('อ่านแล้ว')">อ่านแล้ว</button>
            </div>
            <input type="hidden" id="readStatusVal" value="ยังไม่อ่าน">
          </div>
        </div>

        <button type="submit" class="btn-save" id="btnSubmit">บันทึก</button>
      </form>
    </div>
  </div>

  <!-- Scanner Modal -->
  <div class="modal-overlay" id="scannerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">สแกนบาร์โค้ด ISBN</h2>
        <button class="btn-close" onclick="closeBarcodeScanner()"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <div id="scanner-view"></div>
    </div>
  </div>

</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzC7I97wis3MRFahrjkOoCM-CL6mMuAQG9eiJVJ2ZS_ZrcElq0lBjNCa6UZpWAh-DqD/exec";
  const AUTH_CREDENTIALS = { user: "sparkle", pass: "lunafreya#6913" };
  
  let dbTitles = [];
  // ดึงรายการ Wishlist จาก localStorage
  let wishlistItems = JSON.parse(localStorage.getItem('sparkle_wishlist') || '[]');
  let currentMode = 'library'; 
  let currentFilteredList = [];
  let currentPage = 1;
  const PAGE_SIZE = 5; // เปลี่ยนเป็นแสดง 5 รายการต่อหน้าแล้วครับ
  let html5QrScanner = null;

  window.addEventListener('DOMContentLoaded', () => checkAuth());

  function checkAuth() {
    const isAuth = localStorage.getItem("sparkle_auth");
    const expiry = localStorage.getItem("sparkle_auth_expiry");
    const now = Date.now();
    if (isAuth === "true" && expiry && now < parseInt(expiry, 10)) {
      document.getElementById("loginScreen").style.display = "none";
      initApp();
    } else {
      localStorage.clear();
      document.getElementById("loginScreen").style.display = "flex";
    }
  }

  function handleLogin(e) {
    e.preventDefault();
    if (document.getElementById("loginUser").value.trim() === AUTH_CREDENTIALS.user && document.getElementById("loginPass").value.trim() === AUTH_CREDENTIALS.pass) {
      localStorage.setItem("sparkle_auth", "true");
      localStorage.setItem("sparkle_auth_expiry", (Date.now() + 12 * 60 * 60 * 1000).toString());
      document.getElementById("loginScreen").style.display = "none";
      initApp();
    } else { alert("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้องครับ"); }
  }

  function initApp() {
    document.getElementById('purchaseDate').value = new Date().toISOString().split('T')[0];
    fetchAllData();
  }

  async function fetchAllData() {
    try {
      const response = await fetch(API_URL + "?action=getTitles", { method: "GET", redirect: "follow" });
      dbTitles = await response.json();
      populatePublisherFilter();
      onFilterChange();
    } catch (error) {
      document.getElementById('libraryCardsContainer').innerHTML = '<div class="empty-state">โหลดข้อมูลล้มเหลวครับ</div>';
    }
  }

  function populatePublisherFilter() {
    const select = document.getElementById('filterPublisher');
    const current = select.value;
    select.innerHTML = '<option value="all">ทุกสำนักพิมพ์</option>';
    const publishers = [...new Set(dbTitles.map(t => t.publisher).filter(Boolean))].sort();
    publishers.forEach(p => { select.appendChild(new Option(p, p)); });
    if (publishers.includes(current)) select.value = current;
  }

  function switchLibMode(mode) {
    currentMode = mode;
    document.getElementById('btnModeLib').classList.toggle('active', mode === 'library');
    document.getElementById('btnModeWish').classList.toggle('active', mode === 'wishlist');
    onFilterChange();
  }

  function onFilterChange() {
    const query = document.getElementById('libSearchInput').value.trim().toLowerCase();
    const typeF = document.getElementById('filterType').value;
    const backF = document.getElementById('filterBacklog').value;
    const pubF = document.getElementById('filterPublisher').value;

    const sourceList = (currentMode === 'library') ? dbTitles : wishlistItems;

    currentFilteredList = sourceList.filter(t => {
      const latest = parseInt(t.latestVol) || 0;
      const read = parseInt(t.readUpTo) || 0;
      let matchB = true;
      if (backF === 'unread_only') matchB = (read < latest);
      if (backF === 'read_all') matchB = (read >= latest && latest > 0);

      return ((t.titleName || '').toLowerCase().includes(query) || (t.publisher || '').toLowerCase().includes(query)) &&
             (typeF === 'all' || t.type === typeF) && (pubF === 'all' || t.publisher === pubF) && matchB;
    });

    currentPage = 1;
    renderLibraryPage();
  }

  function renderLibraryPage() {
    const container = document.getElementById('libraryCardsContainer');
    container.innerHTML = '';
    if (currentFilteredList.length === 0) {
      container.innerHTML = `<div class="empty-state">${currentMode === 'library' ? 'ไม่พบหนังสือ' : 'ไม่มีรายการใน Wishlist'}</div>`;
      document.getElementById('paginationBar').style.display = 'none';
      return;
    }
    document.getElementById('paginationBar').style.display = 'flex';
    const pages = Math.ceil(currentFilteredList.length / PAGE_SIZE) || 1;
    currentFilteredList.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE).forEach(t => container.appendChild(createBookCard(t)));
    document.getElementById('pageIndicator').innerText = `หน้า ${currentPage} / ${pages}`;
    document.getElementById('btnPrevPage').disabled = (currentPage <= 1);
    document.getElementById('btnNextPage').disabled = (currentPage >= pages);
  }

  function changePage(delta) {
    const pages = Math.ceil(currentFilteredList.length / PAGE_SIZE) || 1;
    if (currentPage + delta >= 1 && currentPage + delta <= pages) { currentPage += delta; renderLibraryPage(); }
  }

  function createBookCard(t) {
    const card = document.createElement('div');
    card.className = 'book-card-item';
    const tagClass = t.type === 'นิยาย' ? 'tag-novel' : 'tag-manga';
    const latest = parseInt(t.latestVol) || 0;
    const read = parseInt(t.readUpTo) || 0;
    const pct = latest > 0 ? Math.min(100, Math.round((read / latest) * 100)) : 0;

    card.innerHTML = `
      <div class="card-top-row">
        <div class="card-title-group"><span class="tag-badge ${tagClass}">${t.type}</span><span class="book-name-text">${t.titleName}</span></div>
        <div class="card-action-group">
          <span class="vol-chip">เล่ม ${latest}</span>
          ${currentMode === 'library' 
            ? `<button class="btn-quick-plus" onclick="handleQuickAdd(event, '${t.titleId}')">+1</button>` 
            : `<button class="btn-quick-plus" style="width: auto; padding: 0 8px;" onclick="moveToLibrary(event, '${t.tempId}')">✓ ซื้อ</button>`}
        </div>
      </div>
      <div class="card-progress-row">
        <div class="progress-track"><div class="progress-fill" style="width: ${pct}%"></div></div>
        <span class="progress-text">${read}/${latest} (${pct}%)</span>
      </div>`;
    return card;
  }

  // ระบบย้าย Wishlist เข้าคลัง
  function moveToLibrary(e, tempId) {
    e.stopPropagation();
    const item = wishlistItems.find(w => w.tempId === tempId);
    if (!item) return;
    
    // เปิด Modal ให้กรอกราคา/วันที่ แต่ Lock ปลายทางเป็น Library
    openAddModal();
    document.getElementById('titleName').value = item.titleName;
    setType(item.type);
    document.getElementById('publisher').value = item.publisher;
    document.getElementById('volNo').value = item.latestVol || 1;
    
    setDestination('library');
    document.getElementById('wishlistRemoveId').value = tempId; // ส่ง tempId ไปเพื่อสั่งลบหลังบันทึกเสร็จ
  }

  async function handleQuickAdd(e, titleId) {
    e.stopPropagation();
    const item = dbTitles.find(t => t.titleId === titleId);
    if (!item || !confirm(`เพิ่มเล่ม ${(parseInt(item.latestVol) || 0) + 1} ทันที?`)) return;
    const btn = e.target; btn.disabled = true; btn.innerText = '...';

    const payload = {
      action: 'saveVolume', titleId: item.titleId, titleName: item.titleName, type: item.type, publisher: item.publisher,
      volNo: (parseInt(item.latestVol) || 0) + 1, price: 0, readStatus: 'ยังไม่อ่าน', purchaseDate: new Date().toISOString().split('T')[0]
    };
    try { await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }); await fetchAllData(); } 
    catch (err) { alert("เกิดข้อผิดพลาด"); } 
    finally { btn.disabled = false; btn.innerText = '+1'; }
  }

  function setDestination(dest) {
    document.getElementById('saveDestination').value = dest;
    document.getElementById('btnDestLib').classList.toggle('active', dest === 'library');
    document.getElementById('btnDestWish').classList.toggle('active', dest === 'wishlist');
  }

  function openAddModal() { document.getElementById('addModal').classList.add('show'); setDestination(currentMode); }
  function closeAddModal() { document.getElementById('addModal').classList.remove('show'); document.getElementById('addForm').reset(); document.getElementById('wishlistRemoveId').value = ''; clearChips(); }
  function setType(type) { document.getElementById('typeVal').value = type; document.getElementById('btnTypeManga').classList.toggle('active', type === 'มังงะ'); document.getElementById('btnTypeNovel').classList.toggle('active', type === 'นิยาย'); }
  function setStatus(status) { document.getElementById('readStatusVal').value = status; document.getElementById('btnStatusUnread').classList.toggle('active', status === 'ยังไม่อ่าน'); document.getElementById('btnStatusRead').classList.toggle('active', status === 'อ่านแล้ว'); }
  function setPublisher(p, elem) { document.getElementById('publisher').value = p; clearChips(); if(elem) elem.classList.add('active'); }
  function clearChips() { document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); }
  function stepVol(step) { let i = document.getElementById('volNo'); let v = parseInt(i.value)||0; if (v+step>=1) i.value=v+step; }
  
  function filterSuggestions() {
    const input = document.getElementById('titleName').value.trim().toLowerCase();
    const box = document.getElementById('suggestionsBox'); box.innerHTML = ''; document.getElementById('titleId').value = '';
    if (!input) { box.style.display = 'none'; return; }
    const matched = dbTitles.filter(t => t.titleName.toLowerCase().includes(input));
    if (matched.length > 0) {
      box.style.display = 'block';
      matched.forEach(t => {
        let div = document.createElement('div'); div.className = 'suggestion-item'; div.innerText = `${t.titleName} (${t.publisher})`;
        div.onclick = function() { document.getElementById('titleId').value = t.titleId; document.getElementById('titleName').value = t.titleName; setType(t.type); document.getElementById('publisher').value = t.publisher; document.getElementById('volNo').value = (parseInt(t.latestVol) || 0) + 1; box.style.display = 'none'; };
        box.appendChild(div);
      });
    } else { box.style.display = 'none'; }
  }
  document.addEventListener('click', e => { if(e.target.id !== 'titleName') document.getElementById('suggestionsBox').style.display = 'none'; });

  async function handleSave(e) {
    e.preventDefault();
    const dest = document.getElementById('saveDestination').value;
    const btn = document.getElementById('btnSubmit'); btn.disabled = true; btn.innerText = 'กำลังบันทึก...';

    const formData = {
      titleId: document.getElementById('titleId').value, titleName: document.getElementById('titleName').value,
      type: document.getElementById('typeVal').value, publisher: document.getElementById('publisher').value,
      latestVol: document.getElementById('volNo').value, volNo: document.getElementById('volNo').value,
      price: document.getElementById('price').value, readStatus: document.getElementById('readStatusVal').value, purchaseDate: document.getElementById('purchaseDate').value
    };

    if (dest === 'wishlist') {
      formData.tempId = 'W' + Date.now();
      formData.readUpTo = 0;
      wishlistItems.push(formData);
      localStorage.setItem('sparkle_wishlist', JSON.stringify(wishlistItems));
      alert('บันทึกลง Wishlist แล้ว!');
      closeAddModal(); btn.disabled = false; btn.innerText = 'บันทึก';
      if(currentMode === 'wishlist') onFilterChange();
      return;
    }

    formData.action = 'saveVolume';
    try {
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(formData) });
      const data = await res.json();
      alert(data.message);
      
      // ถ้ามาจากปุ่ม "ซื้อ" ใน Wishlist ให้ลบรายการเดิมทิ้ง
      const removeId = document.getElementById('wishlistRemoveId').value;
      if (removeId) {
        wishlistItems = wishlistItems.filter(w => w.tempId !== removeId);
        localStorage.setItem('sparkle_wishlist', JSON.stringify(wishlistItems));
      }
      
      closeAddModal(); await fetchAllData();
    } catch(err) { alert("เกิดข้อผิดพลาด"); } finally { btn.disabled = false; btn.innerText = 'บันทึก'; }
  }

  function switchTab(target) {
    ['libScreen', 'dashScreen'].forEach(s => document.getElementById(s).classList.remove('active'));
    ['tabLib', 'tabDash'].forEach(t => document.getElementById(t).classList.remove('active-tab'));
    if(target === 'lib') { document.getElementById('libScreen').classList.add('active'); document.getElementById('tabLib').classList.add('active-tab'); onFilterChange(); } 
    else { document.getElementById('dashScreen').classList.add('active'); document.getElementById('tabDash').classList.add('active-tab'); }
  }

  function openBarcodeScanner() {
    document.getElementById('scannerModal').classList.add('show');
    html5QrScanner = new Html5Qrcode("scanner-view");
    html5QrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
      document.getElementById('libSearchInput').value = decodedText; closeBarcodeScanner(); onFilterChange();
    }, () => {});
  }
  function closeBarcodeScanner() { if(html5QrScanner) html5QrScanner.stop().then(() => { html5QrScanner.clear(); document.getElementById('scannerModal').classList.remove('show'); }); else document.getElementById('scannerModal').classList.remove('show'); }
</script>

</body>
</html>
